name: release
# Push a tag like v1.0.0: builds the wheel + sdist, attaches them to a GitHub release and pushes the image to GHCR.
on:
  push:
    tags: ['v*']

jobs:
  dist:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: The prebuilt UI must be committed (studio/web/dist is bundled into the wheel)
        run: test -f studio/web/dist/index.html
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Smoke-test the wheel in a clean venv
        run: WHEEL="$(ls dist/*.whl)" scripts/check_package.sh
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/* }
      - name: Attach to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  image:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pythia-studio
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  windows-installer:
    runs-on: windows-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build the self-contained Windows app and installer
        run: python packaging/windows/build.py --no-prebuild
      - uses: actions/upload-artifact@v4
        with: { name: windows-installer, path: dist/PYTHIA-Studio-Setup-*.exe }
      - name: Attach to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PYTHIA-Studio-Setup-*.exe
