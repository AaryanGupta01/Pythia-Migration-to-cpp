name: PYTHIA differential oracle
on: [push, pull_request]
jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Run differential oracle (CPython vs generated C)
        run: python3 tools/oracle.py -v

  libmode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install pybind11
        run: python3 -m pip install pybind11
      - name: Library-mode self-check (CPython vs pybind11 module)
        run: python3 scripts/check_libmode.py

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Wheel -> fresh venv -> boot -> offline demo job
        run: scripts/check_package.sh
