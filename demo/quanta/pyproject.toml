[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quanta"
version = "0.4.1"
description = "A small analytics and simulation toolkit in plain Python"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
numpy = ["numpy>=1.24"]

[project.scripts]
quanta = "quanta.cli:main"

[tool.setuptools.packages.find]
include = ["quanta*"]
