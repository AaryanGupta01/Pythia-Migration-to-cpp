<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" width="1400" height="600"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#4f5664"/></marker></defs><rect width="1400" height="600" fill="#ffffff"/><text x="30" y="40" font-family="Inter, sans-serif" font-size="17" font-weight="750" fill="#0e8f8f" text-anchor="start" letter-spacing="1">REVIEW 2  ·  a command-line transpiler</text><text x="30" y="62" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#4f5664" text-anchor="start" >you hand it typed PySub; you get C++17. 17/17 positive and 20/20 negative oracle programs; PyDict and PySet runtime libraries; C11 to C++17 migration.</text><rect x="30" y="85" width="160" height="100" rx="11" fill="#ecf6f6" stroke="#0e8f8f" stroke-width="1.6" /><g transform="translate(97.0 96.0) scale(1.0833)" fill="none" stroke="#0e8f8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12.5 8 15l2 2.5"/><path d="m14 12.5 2 2.5-2 2.5"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/></g><text x="110.0" y="141" font-family="Inter, sans-serif" font-size="15.5" font-weight="650" fill="#14171f" text-anchor="middle" >typed PySub</text><text x="110.0" y="159" font-family="JetBrains Mono, monospace" font-size="12.5" font-weight="500" fill="#7c8391" text-anchor="middle" >every function</text><text x="110.0" y="174" font-family="JetBrains Mono, monospace" font-size="12.5" font-weight="500" fill="#7c8391" text-anchor="middle" >annotated</text><rect x="222" y="85" width="160" height="100" rx="11" fill="#ecf6f6" stroke="#0e8f8f" stroke-width="1.6" /><g transform="translate(289.0 96.0) scale(1.0833)" fill="none" stroke="#0e8f8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 12h-5"/><path d="M15 8h-5"/><path d="M19 17V5a2 2 0 0 0-2-2H4"/><path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3"/></g><text x="302.0" y="141" font-family="Inter, sans-serif" font-size="15.5" font-weight="650" fill="#14171f" text-anchor="middle" >lexer + parser</text><text x="302.0" y="159" font-family="JetBrains Mono, monospace" font-size="12.5" font-weight="500" fill="#7c8391" text-anchor="middle" >INDENT/DEDENT</text><text x="302.0" y="174" font-family="JetBrains Mono, monospace" font-size="12.5" font-weight="500" fill="#7c8391" text-anchor="middle" >Pratt</text><path d="M192,135 H219" fill="none" stroke="#7c8391" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="414" y="85" width="160" height="100" rx="11" fill="#ecf6f6" stroke="#0e8f8f" stroke-width="1.6" /><g transform="translate(481.0 96.0) scale(1.0833)" fill="none" stroke="#0e8f8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"/><path d="m9 12 2 2 4-4"/></g><text x="494.0" y="141" font-family="Inter, sans-serif" font-size="15.5" font-weight="650" fill="#14171f" text-anchor="middle" >type checker</text><text x="494.0" y="159" font-family="JetBrains Mono, monospace" font-size="12.5" font-weight="500" fill="#7c8391" text-anchor="middle" >bidirectional</text><path d="M384,135 H411" fill="none" stroke="#7c8391" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="606" y="85" width="160" height="100" rx="11" fill="#ecf6f6" stroke="#0e8f8f" stroke-width="1.6" /><g transform="translate(673.0 96.0) scale(1.0833)" fill="none" stroke="#0e8f8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 