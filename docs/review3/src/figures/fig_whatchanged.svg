</g><text x="605.0" y="366" font-family="Inter, sans-serif" font-size="15.5" font-weight="650" fill="#14171f" text-anchor="middle" >infer types</text><text x="605.0" y="384" font-family="JetBrains Mono, monospace" font-size="12.5" font-weight="500" fill="#7c8391" text-anchor="middle" >in-house,</text><text x="605.0" y="399" font-family="JetBrains Mono, monospace" font-size="12.5" font-weight="500" fill="#7c8391" text-anchor="middle" >no LLM</text><path d="M510,365 H531" fill="none" stroke="#7c8391" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="542" y="299" width="44" height="20" rx="10" fill="#584bf0"/><text x="564" y="313.5" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" >NEW</text><rect x="702" y="310" width="142" height="110" rx="11" fill="#ecf6f6" stroke="#0e8f8f" stroke-width="1.6" /><g transform="translate(760.0 321.0) scale(1.0833)" fill="none" stroke="#0e8f8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"/><path d="m9 12 2 2 4-4"/></g><text x="773.0" y="366" font-family="Inter, sans-serif" font-size="15.5" font-weight="650" fill="#14171f" text-anchor="middle" >R2 compiler</text><text x="773.0" y="384" font-family="JetBrains Mono, monospace" font-size="12.5" font-weight="500" fill="#7c8391" text-anchor="middle" >reused and</text><text x="773.0" y="399" font-family="JetBrains Mono, monospace" font-size="12.5" font-weight="500" fill="#7c8391" text-anchor="middle" >extended</text><path d="M678,365 H699" fill="none" stroke="#7c8391" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="710" y="299" width="62" height="20" rx="10" fill="#0e8f8f"/><text x="741" y="313.5" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" >REUSED</text><rect x="870" y="310" width="142" height="110" rx="11" fill="#f2f1fe" stroke="#584bf0" stroke-width="1.6" /><g transform="translate(928.0 321.0) scale(1.0833)" fill="none" stroke="#584bf0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/></g><text x="941.0" y="366" font-family="Inter, sans-serif" font-size="15.5" font-weight="650" fill="#14171f" text-anchor="middle" >pybind11 module</text><text x="941.0" y="384" font-family="JetBrains Mono, monospace" font-size="12.5" font-weight="500" fill="#7c8391" text-anchor="middle" >marshalling</text><text x="941.0" y="399" font-family="JetBrains Mono, monospace" font-size="12.5" font-weight="500" fill="#7c8391" text-anchor="middle" >.so / .pyd</text><path d="M846,365 H867" fill="none" stroke="#7c8391" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="878" y="299" width="44" height="20" rx="10" fill="#584bf0"/><text x="900" y="313.5" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" >NEW</text><rect x="1038" y="310" width="142" height="110" rx="11" fill="#f2f1fe" stroke="#584bf0" stroke-width="1.6" /><g transform="translate(1096.0 321.0) scale(1.0833)" fill="none" stroke="#584bf0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></g><text x="1109.0" y="366" font-family="Inter, sans-serif" font-size="15.5" font-weight="650" fill="#14171f" text-anchor="middle" >replay verify</text><text x="1109.0" y="384" font-family="JetBrains Mono, monospace" font-size="12.5" font-weight="500" fill="#7c8391" text-anchor="middle" >recorded calls</text><text x="1109.0" y="399" font-family="JetBrains Mono, monospace" font-size="12.5" font-weight="500" fill="#7c8391" text-anchor="middle" >vs CPython</text><path d="M1014,365 H1035" fill="none" stroke="#7c8391" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="1046" y="299" width="44" height="20" rx="10" fill="#584bf0"/><text x="1068" y="313.5" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" >NEW</text><rect x="1206" y="310" width="142" height="110" rx="11" fill="#f2f1fe" stroke="#584bf0" stroke-width="1.6" /><g transform="translate(1264.0 321.0) scale(1.0833)" fill="none" stroke="#584bf0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/></g><text x="1277.0" y="366" font-family="Inter, sans-serif" font-size="15.5" font-weight="650" fill="#14171f" text-anchor="middle" >splice + report</text><text x="1277.0" y="384" font-family="JetBrains Mono, monospace" font-size="12.5" font-weight="500" fill="#7c8391" text-anchor="middle" >diff, fidelity,</text><text x="1277.0" y="399" font-family="JetBrains Mono, monospace" font-size="12.5" font-weight="500" fill="#7c8391" text-anchor="middle" >speedups</text><path d="M1182,365 H1203" fill="none" stroke="#7c8391" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="1214" y="299" width="44" height="20" rx="10" fill="#584bf0"/><text x="1236" y="313.5" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" >NEW</text><rect x="30" y="455" width="1340" height="120" rx="14" fill="#f3f2fe" stroke="#aca5f8" stroke-width="1.4"/><text x="52" y="485" font-family="Inter, sans-serif" font-size="14.5" font-weight="750" fill="#584bf0" text-anchor="start" letter-spacing="1.2">WHY WE PIVOTED</text><text x="52" y="512" font-family="Inter, sans-serif" font-size="14.5" font-weight="500" fill="#14171f" text-anchor="start" >A plain transpiler needs the program written in a typed subset first. Real developers already have an untyped project and want</text><text x="52" y="533" font-family="Inter, sans-serif" font-size="14.5" font-weight="500" fill="#14171f" text-anchor="start" >the slow parts faster without rewriting it. So Review 3 moves up a level: repo-level scan, rank, convert, verify, splice, and every</text><text x="52" y="554" font-family="Inter, sans-serif" font-size="14.5" font-weight="500" fill="#14171f" text-anchor="start" >step is visible. The WebAssembly back end promised in Review 2 was dropped in favour of this (see Section 3.4).</text></svg>