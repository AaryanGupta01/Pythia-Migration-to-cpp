Brains Mono, monospace" font-size="12.5" font-weight="500" fill="#7c8391" text-anchor="middle" ></text><path d="M960,135 H987" fill="none" stroke="#7c8391" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="1182" y="85" width="160" height="100" rx="11" fill="#ecf6f6" stroke="#0e8f8f" stroke-width="1.6" /><g transform="translate(1249.0 96.0) scale(1.0833)" fill="none" stroke="#0e8f8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></g><text x="1262.0" y="141" font-family="Inter, sans-serif" font-size="15.5" font-weight="650" fill="#14171f" text-anchor="middle" >g++ -&gt; binary</text><text x="1262.0" y="159" font-family="JetBrains Mono, monospace" font-size="12.5" font-weight="500" fill="#7c8391" text-anchor="middle" >run vs CPython</text><path d="M1152,135 H1179" fill="none" stroke="#7c8391" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah)"/><line x1="30" y1="222" x2="1370" y2="222" stroke="#d9dce4" stroke-width="1.5"/><path d="M700 210 l10 12 l10 -12" fill="none" stroke="#7c8391" stroke-width="2"/><text x="30" y="262" font-family="Inter, sans-serif" font-size="17" font-weight="750" fill="#584bf0" text-anchor="start" letter-spacing="1">REVIEW 3  ·  PYTHIA Studio, a desktop app for whole projects</text><text x="30" y="284" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#4f5664" text-anchor="start" >you hand it ordinary Python (snippet, file, folder or GitHub URL); it finds the slow parts, converts what it can, proves each one against CPython, and splices it in.</text><rect x="30" y="310" width="142" height="110" rx="11" fill="#f2f1fe" stroke="#584bf0" stroke-width="1.6" /><g transform="translate(88.0 321.0) scale(1.0833)" fill="none" stroke="#584bf0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></g><text x="101.0" y="366" font-family="Inter, sans-serif" font-size="15.5" font-weight="650" fill="#14171f" text-anchor="middle" >any Python</text><text x="101.0" y="384" font-family="JetBrains Mono, monospace" font-size="12.5" font-weight="500" fill="#7c8391" text-anchor="middle" >snippet · file</text><text x="101.0" y="399" font-family="JetBrains Mono, monospace" font-size="12.5" font-weight="500" fill="#7c8391" text-anchor="middle" >folder · URL</text><rect x="38" y="299" width="44" height="20" rx="10" fill="#584bf0"/><text x="60" y="313.5" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" >NEW</text><rect x="198" y="310" width="142" height="110" rx="11" fill="#f2f1fe" stroke="#584bf0" stroke-width="1.6" /><g transform="translate(256.0 321.0) scale(1.0833)" fill="none" stroke="#584bf0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/><path d="m16 16-1.9-1.9"/></g><text x="269.0" y="366" font-family="Inter, sans-serif" font-size="15.5" font-weight="650" fill="#14171f" text-anchor="middle" >scan</text><text x="269.0" y="384" font-family="JetBrains Mono, monospace" font-size="12.5" font-weight="500" fill="#7c8391" text-anchor="middle" >compiler is</text><text x="269.0" y="399" font-family="JetBrains Mono, monospace" font-size="12.5" font-weight="500" fill="#7c8391" text-anchor="middle" >the judge</text><path d="M174,365 H195" fill="none" stroke="#7c8391" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="206" y="299" width="44" height="20" rx="10" fill="#584bf0"/><text x="228" y="313.5" font-family="Inter, sans-seri