<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#4f5664"/></marker></defs><rect width="1000" height="470" fill="#ffffff"/><text x="24" y="30" font-family="Inter, sans-serif" font-size="13.5" font-weight="750" fill="#7c8391" text-anchor="start" letter-spacing="1">A FUNCTION THE TYPE CHECKER REJECTED AS WRITTEN</text><rect x="24" y="48" width="300" height="88" rx="12" fill="#f3f2fe" stroke="#584bf0" stroke-width="1.6" /><g transform="translate(38.0 62.0) scale(1.0833)" fill="none" stroke="#584bf0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></g><text x="76" y="81" font-family="Inter, sans-serif" font-size="15.5" font-weight="700" fill="#14171f" text-anchor="start" >1  Annotate from observed types</text><text x="38" y="110" font-family="Inter, sans-serif" font-size="12.8" font-weight="500" fill="#4f5664" text-anchor="start" >types the tracer saw at run time</text><text x="38" y="127" font-family="Inter, sans-serif" font-size="12.8" font-weight="500" fill="#4f5664" text-anchor="start" >annotate.py</text><path d="M324,92 H372" fill="none" stroke="#4f5664" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="24" y="148" width="300" height="88" rx="12" fill="#f3f2fe" stroke="#584bf0" stroke-width="1.6" /><g transform="translate(38.0 162.0) scale(1.0833)" fill="none" stroke="#584bf0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M9 13a4.5 4.5 0 0 0 3-4"/><path d="M6.003 5.125A3 3 0 0 0 6.401 6.5"/><path d="M3.477 10.896a4 4 0 0 1 .585-.396"/><path d="M6 18a4 4 0 0 1-1.967-.516"/><path d="M12 13h4"/><path d="M12 18h6a2 2 0 0 1 2 2v1"/><path d="M12 8h8"/><path d="M16 8V5a2 2 0 0 1 2-2"/><circle cx="16" cy="13" r=".5"/><circle cx="18" cy="3" r=".5"/><circle cx="20" cy="21" r=".5"/><circle cx="20" cy="8" r=".5"/></g><text x="76" y="181" font-family="Inter, sans-serif" font-size="15.5" font-weight="700" fill="#14171f" text-anchor="start" >2  Infer from usage</text><text x="38" y="210" font-family="Inter, sans-serif" font-size="12.8" font-weight="500" fill="#4f5664" text-anchor="start" >doctests, call sites, assignments,</text><text x="38" y="227" font-family="Inter, sans-serif" font-size="12.8" font-weight="500" fill="#4f5664" text-anchor="start" >whole-program fixpoint (convert/)</text><path d="M324,192 H372" fill="none" stroke="#4f5664" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="24" y="248" width="300" height="88" rx="12" fill="#fbf5ee" stroke="#c2710c" stroke-width="1.6" stroke-dasharray="6 5"/><g transform="translate(38.0 262.0) scale(1.0833)" fill="none" stroke="#c2710c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/></g><text x="76" y="281" font-family="Inter, sans-serif" font-size="15.5" font-weight="700" fill="#14171f" text-anchor="start" >3  LLM rewrite (optional)</text><text x="38" y="310" font-family="Inter, sans-serif" font-size="12.8" font-weight="500" fill="#4f5664" text-anchor="start" >only if a key is configured; at most</text><text x="38" y="327" font-family="Inter, sans-serif" font-size="12.8" font-weight="500" fill="#4f5664" text-anchor="start" >3 attempts, errors fed back</text><path d="M324,292 H372" fill="none" stroke="#4f5664" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="376" y="48" width="130" height="288" rx="14" fill="#e9f5f5" stroke="#0e8f8f" stroke-width="1.6"/><g transform="translate(428.0 62.0) scale(1.0833)" fill="none" stroke="#0e8f8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"/><path d="m9 12 2 2 4-4"/></g><text x="441" y="112" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#14171f" text-anchor="middle" >Compiler</text><text x="441" y="131" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#14171f" text-anchor="middle" >gate</text><text x="441" y="168" font-family="Inter, sans-serif" font-size="12.8" font-weight="500" fill="#4f5664" text-anchor="middle" >PySub parser</text><text x="441" y="186" font-family="Inter, sans-serif" font-size="12.8" font-weight="500" fill="#4f5664" text-anchor="middle" >+ type checker</text><text x="441" y="204" font-family="Inter, sans-serif" font-size="12.8" font-weight="500" fill="#4f5664" text-anchor="middle" >accept or</text><text x="441" y="222" font-family="Inter, sans-serif" font-size="12.8" font-weight="500" fill="#4f5664" text-anchor="middle" >reject with</text><text x="441" y="240" font-family="Inter, sans-serif" font-size="12.8" font-weight="500" fill="#4f5664" text-anchor="middle" >a reason</text><rect x="536" y="62" width="205" height="116" rx="12" fill="#eef7f7" stroke="#0e8f8f" stroke-width="1.6" /><g transform="translate(550.0 76.0) scale(1.0833)" fill="none" stroke="#0e8f8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 12-8.373 8.373a1 1 0 1 1-3-3L12 9"/><path d="m18 15 4-4"/><path d="m21.5 11.5-1.914-1.914A2 2 0 0 1 19 8.172V7l-2.26-2.26a6 6 0 0 0-4.202-1.756L9 2.96l.92.82A6.18 6.18 0 0 1 12 8.4V10l2 2h1.172a2 2 0 0 1 1.414.586L18.5 14.5"/></g><text x="588" y="95" font-family="Inter, sans-serif" font-size="15.5" font-weight="700" fill="#14171f" text-anchor="start" >Compile</text><text x="550" y="124" font-family="Inter, sans-serif" font-size="12.8" font-weight="500" fill="#4f5664" text-anchor="start" >C++17 + pybind11</text><text x="550" y="141" font-family="Inter, sans-serif" font-size="12.8" font-weight="500" fill="#4f5664" text-anchor="start" >-&gt; .so / .pyd</text><rect x="766" y="62" width="205" height="116" rx="12" fill="#eff7f4" stroke="#15935f" stroke-width="1.6" /><g transform="translate(780.0 76.0) scale(1.0833)" fill="none" stroke="#15935f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></g><text x="818" y="95" font-family="Inter, sans-serif" font-size="15.5" font-weight="700" fill="#14171f" text-anchor="start" >Replay</text><text x="780" y="124" font-family="Inter, sans-serif" font-size="12.8" font-weight="500" fill="#4f5664" text-anchor="start" >recorded calls vs</text><text x="780" y="141" font-family="Inter, sans-serif" font-size="12.8" font-weight="500" fill="#4f5664" text-anchor="start" >CPython, floats bitwise</text><rect x="536" y="202" width="205" height="116" rx="12" fill="#eff7f4" stroke="#15935f" stroke-width="1.6" /><g transform="translate(550.0 216.0) scale(1.0833)" fill="none" stroke="#15935f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></g><text x="588" y="235" font-family="Inter, sans-serif" font-size="15.5" font-weight="700" fill="#14171f" text-anchor="start" >Benchmark</text><text x="550" y="264" font-family="Inter, sans-serif" font-size="12.8" font-weight="500" fill="#4f5664" text-anchor="start" >median speedup</text><text x="550" y="281" font-family="Inter, sans-serif" font-size="12.8" font-weight="500" fill="#4f5664" text-anchor="start" >kept if &gt;= 1.1x</text><rect x="766" y="202" width="205" height="116" rx="12" fill="#f3f2fe" stroke="#584bf0" stroke-width="1.6" /><g transform="translate(780.0 216.0) scale(1.0833)" fill="none" stroke="#584bf0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/></g><text x="818" y="235" font-family="Inter, sans-serif" font-size="15.5" font-weight="700" fill="#14171f" text-anchor="start" >Splice</text><text x="780" y="264" font-family="Inter, sans-serif" font-size="12.8" font-weight="500" fill="#4f5664" text-anchor="start" >one decorator line;</text><text x="780" y="281" font-family="Inter, sans-serif" font-size="12.8" font-weight="500" fill="#4f5664" text-anchor="start" >body untouched</text><path d="M506,120 H532" fill="none" stroke="#4f5664" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M741,120 H766" fill="none" stroke="#4f5664" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M770,178 V190 H640 V202" fill="none" stroke="#4f5664" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M741,260 H766" fill="none" stroke="#4f5664" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="24" y="350" width="952" height="96" rx="14" fill="#fcf3f2" stroke="#cd372e" stroke-width="1.5"/><g transform="translate(44.0 366.0) scale(1.1667)" fill="none" stroke="#cd372e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 9-6 6"/><path d="M2.586 16.726A2 2 0 0 1 2 15.312V8.688a2 2 0 0 1 .586-1.414l4.688-4.688A2 2 0 0 1 8.688 2h6.624a2 2 0 0 1 1.414.586l4.688 4.688A2 2 0 0 1 22 8.688v6.624a2 2 0 0 1-.586 1.414l-4.688 4.688a2 2 0 0 1-1.414.586H8.688a2 2 0 0 1-1.414-.586z"/><path d="m9 9 6 6"/></g><text x="84" y="388" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#14171f" text-anchor="start" >Any rung or gate can fail, and failure is a normal outcome, not an error</text><text x="84" y="412" font-family="Inter, sans-serif" font-size="13.4" font-weight="500" fill="#4f5664" text-anchor="start" >The function stays plain Python and the UI shows the reason in English, for example: "int on some runs, float on others", "uses numpy",</text><text x="84" y="431" font-family="Inter, sans-serif" font-size="13.4" font-weight="500" fill="#4f5664" text-anchor="start" >"object of type X", or "measured speedup below 1.1x". Nothing that failed a gate is ever spliced.</text><path d="M174,336 V348" fill="none" stroke="#cd372e" stroke-width="1.8" stroke-dasharray="6 5" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M441,336 V348" fill="none" stroke="#cd372e" stroke-width="1.8" stroke-dasharray="6 5" stroke-linejoin="round" marker-end="url(#ah)"/></svg>